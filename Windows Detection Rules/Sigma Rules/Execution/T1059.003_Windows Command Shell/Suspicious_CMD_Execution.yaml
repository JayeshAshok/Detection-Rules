title: Suspicious CMD Execution
id: 7d56a22d-8f6d-4fd8-bb74-cmd-an0578-01
status: experimental

logsource:
  product: windows
  category: process_creation

detection:

  selection_cmd:
    Image|endswith: '\cmd.exe'

  selection_parent:
    ParentImage|endswith:
      - '\winword.exe'
      - '\excel.exe'
      - '\powerpnt.exe'
      - '\outlook.exe'
      - '\msedge.exe'
      - '\chrome.exe'
      - '\firefox.exe'
      - '\mshta.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\rundll32.exe'
      - '\regsvr32.exe'

  selection_command:
    CommandLine|contains:
      - ' /c '
      - ' /k '
      - '&&'
      - '||'
      - ' & '

  condition: selection_cmd and (selection_parent or selection_command)

falsepositives:
  - Administrative scripts
  - Software deployment tools

level: medium